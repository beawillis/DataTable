<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DataTable Export</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:2rem;color:#1f2937;background:#f3f6fa}
table{border-collapse:collapse;background:#fff;min-width:60%;box-shadow:0 2px 10px #00000014}
th,td{padding:.65rem .9rem;border:1px solid #d8e0ea;text-align:left}
th{background:#174a7e;color:#fff}
tbody tr:nth-child(even){background:#edf3f8}
tbody tr:hover{background:#dceafa}
</style>
</head>
<body>
<table>
<thead>
<tr><th>Season</th><th>Days</th><th>Total rentals</th><th>Average rentals</th><th>Minimum rentals</th><th>Maximum rentals</th></tr>
</thead>
<tbody>
<tr><td>Fall</td><td>94</td><td>641479</td><td>6824.24</td><td>4073</td><td>8714</td></tr>
<tr><td>Summer</td><td>92</td><td>571273</td><td>6209.49</td><td>1027</td><td>8362</td></tr>
<tr><td>Winter</td><td>89</td><td>515476</td><td>5791.87</td><td>22</td><td>8555</td></tr>
<tr><td>Spring</td><td>91</td><td>321348</td><td>3531.30</td><td>441</td><td>7836</td></tr>
</tbody>
</table>
</body>
</html>
