name: DataTable Build and Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:

  build:
    name: Build and Test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure clean CMake build
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build-ci --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build-ci --output-on-failure

      - name: Install release package
        run: cmake --install build-ci --prefix install-ci